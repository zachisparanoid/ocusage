<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="ocusage — a colorful CLI dashboard for your OpenAI Codex usage limits">
  <defs>
    <linearGradient id="mat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0c"/>
      <stop offset="1" stop-color="#111112"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.86" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#10A37F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#10A37F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="400" fill="url(#mat)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <!-- terminal window card -->
  <rect x="16" y="16" width="1168" height="368" rx="16" fill="#171717" stroke="#2b2b2b" stroke-width="1"/>

  <!-- window header -->
  <circle cx="46" cy="44" r="6" fill="#F87171"/>
  <circle cx="70" cy="44" r="6" fill="#FBBF24"/>
  <circle cx="94" cy="44" r="6" fill="#4ADE80"/>
  <text x="600" y="49" text-anchor="middle" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="14" fill="#8A8A8A">ocusage</text>
  <line x1="16" y1="72" x2="1184" y2="72" stroke="#2b2b2b" stroke-width="1"/>

  <!-- kicker -->
  <text x="56" y="126" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="16" letter-spacing="4" fill="#8A8A8A">OPENAI CODEX · USAGE</text>

  <!-- wordmark -->
  <text x="54" y="212" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="96" font-weight="700" fill="#E6E6E6" letter-spacing="-3">oc<tspan fill="#10A37F">usage</tspan></text>

  <!-- tagline -->
  <text x="58" y="256" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" fill="#8A8A8A">Your 5-hour and weekly Codex limits, at a glance — from the terminal.</text>

  <!-- bar 1: 5-hour window -->
  <text x="58" y="304" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="15" fill="#E6E6E6">Current 5-hour window</text>
  <rect x="58" y="314" width="560" height="12" rx="6" fill="#3A3A3A"/>
  <rect x="58" y="314" width="39" height="12" rx="6" fill="#4ADE80"/>
  <text x="636" y="325" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="15" font-weight="700" fill="#4ADE80">7%</text>
  <text x="690" y="325" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="14" fill="#8A8A8A">resets in 4h 57m · ~1.24M tokens</text>

  <!-- bar 2: current week -->
  <text x="58" y="352" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="15" fill="#E6E6E6">Current week</text>
  <rect x="58" y="362" width="560" height="12" rx="6" fill="#3A3A3A"/>
  <rect x="58" y="362" width="134" height="12" rx="6" fill="#4ADE80"/>
  <text x="636" y="373" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="15" font-weight="700" fill="#4ADE80">24%</text>
  <text x="690" y="373" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="14" fill="#8A8A8A">resets in 5d 16h · ~18.3M tokens</text>

  <!-- prompt, top right -->
  <text x="1140" y="126" text-anchor="end" font-family="'SF Mono','Menlo','Consolas',monospace" font-size="16" fill="#10A37F">$ ocusage</text>
</svg>
